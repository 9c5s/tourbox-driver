[package]
name = "tourbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
fake = []

[dependencies]
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }
serialport = "4.10.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "test-util"] }
tourbox = { path = ".", features = ["fake"] }
